marklogic_integration.status:
  path: 'admin/config/services/marklogic'
  defaults:
    _controller: 'Drupal\marklogic_integration\Controller\MarkLogicController::status'
    _title: 'MarkLogic Configuration'
  requirements:
    _permission: 'administer site configuration'

marklogic_integration.save_employee:
  path: '/admin/config/services/marklogic/save-employee'
  defaults:
    _controller: '\Drupal\marklogic_integration\Controller\MarkLogicController::saveEmployee'
    _title: 'Save Employee to MarkLogic'
  requirements:
    _permission: 'administer site configuration'